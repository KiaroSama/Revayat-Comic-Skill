version: 2
updates:
  # Proposals do not change the supported floors until their compatibility is reviewed.
  - package-ecosystem: pip
    directory: /skills/revayat-comic
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: cargo
    directory: /rust/hotcore-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: cargo
    directory: /rust/pixcore-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  # Keep Actions proposals grouped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
