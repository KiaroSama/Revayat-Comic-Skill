name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo-audit against Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0 and cargo-audit
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          cargo install --locked --version 0.23.0 cargo-audit
      - name: Audit Cargo.lock for known advisories
        run: cargo audit
