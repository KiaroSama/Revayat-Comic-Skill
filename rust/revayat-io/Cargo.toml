[package]
name = "revayat-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Pure Rust comic page readers, exporters and package verification"
build = false

[dependencies]
revayat-ir = { path = "../revayat-ir" }
packcore_rs = { package = "packcore-rs", path = "../packcore-rs", default-features = false }
pixcore_rs = { package = "pixcore-rs", path = "../pixcore-rs", default-features = false }
lopdf = { version = "0.47", default-features = false }
pdf-writer = "0.15"
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
rars = { version = "0.13", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
unicode-bidi = "0.3"
tiff = "0.11.2"
