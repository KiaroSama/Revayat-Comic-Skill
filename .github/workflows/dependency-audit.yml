name: Dependency audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit against Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0 and cargo-audit
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          cargo install --locked cargo-audit
      - name: Audit Cargo.lock for known advisories
        run: cargo audit
