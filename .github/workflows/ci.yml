name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene (pure Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify zero Python source files and zero PyO3 in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          py_files=$(git ls-files '*.py')
          if [ -n "$py_files" ]; then
            echo "Unexpected tracked Python files:" >&2
            printf '%s\n' "$py_files" >&2
            exit 1
          fi
          if grep -Eq '^name = "pyo3"' Cargo.lock; then
            echo "Unexpected pyo3 crate in Cargo.lock" >&2
            exit 1
          fi
      - name: Verify plugin manifests and skill-files.txt stay synchronized
        shell: bash
        run: |
          set -euo pipefail
          ver=$(jq -r '.version' plugin.json)
          test -n "$ver"
          for m in .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json .antigravity-plugin/plugin.json; do
            mv=$(jq -r '.version' "$m")
            if [ "$mv" != "$ver" ]; then
              echo "Version mismatch in $m: $mv != $ver" >&2
              exit 1
            fi
          done
          mpv=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$mpv" != "$ver" ]; then
            echo "Version mismatch in .claude-plugin/marketplace.json: $mpv != $ver" >&2
            exit 1
          fi
          cli_ver=$(grep -m1 '^version = ' rust/revayat-comic-cli/Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')
          if [ "$cli_ver" != "$ver" ]; then
            echo "CLI Cargo.toml version mismatch: $cli_ver != $ver" >&2
            exit 1
          fi
          actual=$(git ls-files 'skills/revayat-comic/' | sed 's#^skills/revayat-comic/##' | LC_ALL=C sort)
          expected=$(LC_ALL=C sort install/skill-files.txt)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

  workspace:
    name: Rust workspace (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: revayat-comic
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: revayat-comic
          - platform: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: revayat-comic.exe
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: revayat-comic.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy --target "${{ matrix.target }}"
          rustup default 1.100.0
          rustc --version | grep -E '^rustc 1\.100\.0 '
      - name: Check formatting
        shell: bash
        run: cargo fmt --all --check
      - name: Lint workspace
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        shell: bash
        run: cargo test --workspace --locked
      - name: Build and smoke-test release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p revayat-comic-cli --target "${{ matrix.target }}"
          mkdir -p bin
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "bin/${{ matrix.bin }}"
          "./bin/${{ matrix.bin }}" doctor --json
