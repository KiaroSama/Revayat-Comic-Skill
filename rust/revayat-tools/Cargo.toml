[package]
name = "revayat-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
fancy-regex = "0.20"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.27", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
textcore_rs = { package = "textcore-rs", path = "../textcore-rs", default-features = false }
thiserror = "2"
tokio = { version = "1.54", features = ["net", "rt-multi-thread", "time", "macros"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "json", "multipart"] }
url = "2"
