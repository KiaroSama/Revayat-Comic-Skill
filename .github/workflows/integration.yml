name: Optional toolchain integration

# Linux push CI already installs a RAR reader and exercises the retained genuine
# RAR fixture. This weekly tier separately retains reader evidence and processes
# a full 300-dpi chapter, which does not belong on every push.
#
# Kept off the push path on purpose. Apt and a third-party archive backend are
# the least stable things in this repository's CI, and a flake in either must
# not block an unrelated commit.
on:
  workflow_dispatch:
  schedule:
    # Weekly, early Monday UTC. Enough to catch a breaking release without
    # spending a runner on every commit.
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cbr:
    name: CBR routing and failure paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the archive toolchain
        run: |
          sudo apt-get update -qq
          # libarchive-tools provides bsdtar, which rarfile accepts as a
          # backend and which — unlike unrar — is free software and packaged
          # in main.
          sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/revayat-comic/requirements.txt
          python -m pip install rarfile
          python -m pip install -r tests/requirements.txt

      - name: The backend is actually here
        # Without this the CBR test would skip itself and the job would pass
        # green having proved nothing at all — the exact failure this tier
        # exists to avoid.
        run: |
          python - <<'PY'
          import shutil, sys
          import rarfile

          backend = shutil.which("bsdtar") or shutil.which("unrar")
          assert backend, "no unrar/bsdtar backend: the CBR tier cannot run"
          print(f"ok: rarfile {rarfile.__version__} with backend {backend}")
          PY

      - name: The CBR paths this project owns
        # Run the complete reader file ONCE, including the genuine RAR fixture,
        # routing and failure cases; inspect that same machine-readable report.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/test_readers.py -q -rs --timeout=120 --junitxml=junit-cbr.xml

      - name: The retained CBR evidence has no unexpected skips
        if: always()
        run: python .github/check_skips.py junit-cbr.xml

      - name: Keep the CBR evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-cbr-evidence
          path: junit-cbr.xml
          if-no-files-found: error
          retention-days: 14

  full_resolution:
    name: a whole chapter at 300 dpi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install a Persian-capable font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/revayat-comic/requirements.txt

      - name: Detect, clean and typeset A4-at-300dpi pages
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import sys, tempfile, time
          from pathlib import Path

          sys.path[:0] = ["tests", "skills/revayat-comic/scripts"]
          from tests_support import manga_page, page_bytes
          import clean, detect, falint, masks, pageir as ir, qa, readers, typeset, export

          WIDTH, HEIGHT, PAGES = 2480, 3508, 4
          work = Path(tempfile.mkdtemp())
          folder = work / "src"
          folder.mkdir()
          for index in range(PAGES):
              (folder / f"{index + 1:03d}.png").write_bytes(
                  page_bytes(manga_page(WIDTH, HEIGHT, dark_balloon=index % 2 == 1))
              )

          started = time.monotonic()
          report = readers.import_source(folder, work / "w", source_language="ja")
          doc_path = Path(report["document"])

          found = detect.detect_document(doc_path)
          assert found["totals"]["speech"] == 3 * PAGES, found["totals"]
          assert found["totals"]["panels"] == 4 * PAGES, found["totals"]

          masks.build_document(doc_path)
          doc = ir.load_doc(doc_path)
          for page in doc["pages"]:
              assert page["mask_coverage"] < 0.15, (page["id"], page["mask_coverage"])

          # Stand in for the reader.
          lines = ["بس کن! این‌جا چه خبر است؟", "هیچ‌کس نمی‌داند او کجا رفته.", "دوباره برگشتی؟"]
          for index, (_, region) in enumerate(ir.iter_regions(doc)):
              region["source_text"] = "やめろ！"
              region["target_text"] = lines[index % len(lines)]
              region["locked"] = True
          ir.save_doc(doc, doc_path)

          falint.fix_document(doc_path)
          cleaned = clean.clean_document(doc_path)
          assert cleaned["totals"]["flat"] > 0, cleaned["totals"]

          set_up = typeset.typeset_document(doc_path)
          assert not set_up["overflow"], set_up["overflow"]

          gate = qa.check_document(doc_path)
          assert gate["ok"], gate["findings"][:4]
          assert gate["stats"]["artwork_pixels_changed"] == 0

          out = work / "chapter-fa.cbz"
          export.export_document(doc_path, out)
          assert qa.check_package(out, doc_path)["ok"]

          elapsed = time.monotonic() - started
          print(f"ok: {PAGES} pages at {WIDTH}x{HEIGHT} in {elapsed:.0f}s, "
                f"{gate['stats']['translated']} regions, 0 pixels changed outside the masks")
          PY
