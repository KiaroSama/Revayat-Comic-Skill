[package]
name = "detectcore-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Optional native comic detection kernels for Revayat Comic"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
