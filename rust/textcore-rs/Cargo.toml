[package]
name = "textcore-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Rust port of `skills/revayat-comic/scripts/textcore/`, generated by rust-anything"

[lib]
crate-type = ["rlib"]

[dependencies]
fancy-regex = "0.20.2"
num-bigint = "0.5.1"
regex = "1.13.2"
unicode-general-category = "1.0.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
