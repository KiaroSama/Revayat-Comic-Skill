[package]
name = "hotcore-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Rust port of `skills/revayat-comic/scripts/hotcore/`, generated by rust-anything"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
