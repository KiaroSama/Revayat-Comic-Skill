[package]
name = "revayat-vision"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Comic image preparation, Persian lettering, and artwork QA"

[dependencies]
cleancore_rs = { package = "cleancore-rs", path = "../cleancore-rs", default-features = false }
detectcore_rs = { package = "detectcore-rs", path = "../detectcore-rs", default-features = false }
hotcore_rs = { package = "hotcore-rs", path = "../hotcore-rs", default-features = false }
layoutcore_rs = { package = "layoutcore-rs", path = "../layoutcore-rs", default-features = false }
maskcore_rs = { package = "maskcore-rs", path = "../maskcore-rs", default-features = false }
pixcore_rs = { package = "pixcore-rs", path = "../pixcore-rs", default-features = false }
qacore_rs = { package = "qacore-rs", path = "../qacore-rs", default-features = false }
textcore_rs = { package = "textcore-rs", path = "../textcore-rs", default-features = false }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
fontdb = { version = "0.23", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.27", default-features = false }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fancy-regex = "0.20"
num-bigint = "0.5.1"
thiserror = "2"
