[package]
name = "revayat-comic-cli"
version = "1.2.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "revayat-comic"
path = "src/main.rs"

[dependencies]
cleancore_rs = { package = "cleancore-rs", path = "../cleancore-rs", default-features = false }
detectcore_rs = { package = "detectcore-rs", path = "../detectcore-rs", default-features = false }
hotcore_rs = { package = "hotcore-rs", path = "../hotcore-rs", default-features = false }
layoutcore_rs = { package = "layoutcore-rs", path = "../layoutcore-rs", default-features = false }
maskcore_rs = { package = "maskcore-rs", path = "../maskcore-rs", default-features = false }
packcore_rs = { package = "packcore-rs", path = "../packcore-rs", default-features = false }
pixcore_rs = { package = "pixcore-rs", path = "../pixcore-rs", default-features = false }
qacore_rs = { package = "qacore-rs", path = "../qacore-rs", default-features = false }
textcore_rs = { package = "textcore-rs", path = "../textcore-rs", default-features = false }
num-bigint = "0.4.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }

[dev-dependencies]
time = { version = "0.3.55", default-features = false, features = ["macros", "parsing"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
