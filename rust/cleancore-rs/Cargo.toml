[package]
name = "cleancore-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
description = "Optional native page cleaning kernels for Revayat Comic"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
