[build-system]
requires = ["maturin>=1.12.0,<2.0"]
build-backend = "maturin"

[project]
name = "textcore-rs"
version = "0.1.0"
description = "Optional native Persian text and layout kernels for Revayat Comic"
requires-python = ">=3.12"

[tool.maturin]
python-source = "python"
module-name = "textcore_rs._native"
