version: 2
updates:
  # Proposals do not change the supported floors until their compatibility is reviewed.
  - package-ecosystem: pip
    directory: /skills/revayat-comic
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: cargo
    directories:
      - /rust/hotcore-rs
      - /rust/pixcore-rs
      - /rust/maskcore-rs
      - /rust/detectcore-rs
      - /rust/qacore-rs
      - /rust/cleancore-rs
      - /rust/layoutcore-rs
      - /rust/packcore-rs
      - /rust/textcore-rs
      - /rust/revayat-comic-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      rust-crates:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /rust/hotcore-rs
      - /rust/pixcore-rs
      - /rust/maskcore-rs
      - /rust/textcore-rs
      - /rust/detectcore-rs
      - /rust/qacore-rs
      - /rust/cleancore-rs
      - /rust/layoutcore-rs
      - /rust/packcore-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      maturin-build:
        patterns: ["*"]

  # Keep Actions proposals grouped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
